<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#ff9ec4,#ffc9de,#ffe6f0);
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:90%;
    max-width:450px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:35px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(255,255,255,.3);
    z-index:10;
    animation:fadeIn 2s;
}

.card h1{
    font-size:34px;
    margin-bottom:15px;
}

.card p{
    font-size:18px;
    line-height:1.8;
}

.love{
    margin-top:25px;
    font-size:28px;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Hati */
.heart{
    position:absolute;
    color:#ff2d75;
    animation:fall linear infinite;
    user-select:none;
}

@keyframes fall{
    0%{
        transform:translateY(-10vh) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>❤️ Happy Girlfriend Day ❤️</h1>

    <p>
        Untuk <b>Sayang</b> 💕<br><br>

        Terima kasih karena selalu hadir
        di setiap cerita hidupku.
        Semoga kita selalu bersama,
        saling menjaga,
        saling menguatkan,
        dan selalu bahagia.
        <br><br>
        Aku sayang kamu hari ini,
        besok,
        dan seterusnya. ❤️
    </p>

    <div class="love">I LOVE YOU ❤️</div>
</div>

<script>

function createHeart(){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(15+Math.random()*35)+"px";

    heart.style.animationDuration=(4+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);

}

setInterval(createHeart,120);

</script>

</body>
</html>
