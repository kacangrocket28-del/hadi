<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSIJA JAKARTA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff6600,#ff3300);
overflow:hidden;
}

.container{
width:90%;
max-width:400px;
background:white;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.3);
animation:muncul 1.5s;
}

@keyframes muncul{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
width:180px;
animation:putar 4s infinite linear;
}

@keyframes putar{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

h1{
margin-top:15px;
color:#ff3300;
}

p{
margin-top:15px;
line-height:28px;
font-size:17px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:20px;
background:#ff3300;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.marquee{
position:absolute;
top:20px;
width:100%;
color:white;
font-size:25px;
font-weight:bold;
animation:jalan 12s linear infinite;
white-space:nowrap;
}

@keyframes jalan{
0%{
transform:translateX(100%);
}
100%{
transform:translateX(-100%);
}
}

</style>
</head>

<body>

<div class="marquee">
PERSIJA SAMPAI MATI • JAKMANIA • PERSIJA JUARA •
</div>

<div class="container" id="box">

<img src="logo.png" class="logo">

<h1>PERSIJA JAKARTA</h1>

<p>
Aku bangga menjadi bagian dari Jakmania.

Menang ataupun kalah, Persija tetap di hati.
</p>

<button onclick="persija()">
Klik Disini
</button>

</div>


<script>

function persija(){

document.getElementById("box").innerHTML = `

<h1>SALAM SATU NYALI!</h1>

<h2>MACAN KEMAYORAN</h2>

<p>

Persija Jakarta bukan sekadar klub sepak bola.

Persija adalah kebanggaan, perjuangan, dan cinta yang tidak pernah pudar.

Kami akan selalu berdiri di tribun, bernyanyi, dan mendukungmu sampai akhir.

PERSIJA SAMPAI MATI!

</p>

`;

}

</script>

</body>
</html>
<img src="pia.jpg" class="pia.jpg">
